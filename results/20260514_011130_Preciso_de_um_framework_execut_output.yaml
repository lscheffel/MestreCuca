prompt: 'Você é um analista orgânico-vital operando sobre a Ontologia Fractal.

  Sua tarefa: Preciso de um framework executável para orquestrar a transição de um
  sistema legado monolítico para um ecossistema distribuído caótico. O objetivo é
  usar a entropia da mudança como catalisador de inovação, garantindo a integridade
  dos dados durante a ruptura.


  ## Contexto Ontológico

  Pilar: BIOS (Orgânico-Vital)

  Domínio: SOMA

  Subárvore: INTEGRIDADE

  Célula focal: ATUALIZAÇÃO_SISTEMA


  ## Conceitos Ativados

  - **ATUALIZAÇÃO_SISTEMA** (N4_SOMA_1_C):  [funções: equilibrar, transformar, avaliar]
  [natureza: estado]

  - **DESTRUIÇÃO_CRIATIVA** (N4_ENTROPIA_1_B):  [funções: avaliar, equilibrar, dissolver]
  [natureza: estado]

  - **DISPERSÃO_ENERGIA** (N4_ENTROPIA_2_A):  [funções: avaliar, dissolver, equilibrar]
  [natureza: vetor]

  - **AUTORREPARAÇÃO** (N4_SOMA_2_B):  [funções: equilibrar, avaliar, regenerar] [natureza:
  estado]

  - **SANEAMENTO** (N4_OIKOS_1_C):  [funções: sequenciar, adaptar, equilibrar] [natureza:
  processo]

  - **ISOMORFISMO** (N4_ESCALA_1_C):  [funções: escalar, mapear, comparar] [natureza:
  fenomeno]

  - **INTEGRIDADE** (N4_ETHOS_2_C):  [funções: avaliar, equilibrar, classificar] [natureza:
  estado]

  - **PARALELIZAÇÃO** (N4_ALGORITMIA_2_C):  [funções: sequenciar, validar, controlar]
  [natureza: processo]

  - **TRANSFORMAÇÃO_EXCEPCIONAL** (N4_SINGULARIDADE_1_C):  [funções: transformar,
  emergir, prever] [natureza: fenomeno]

  - **TRANSFORMAÇÃO** (N4_ESTETICA_3_A):  [funções: transformar, comparar, avaliar]
  [natureza: fenomeno]

  - **MANUTENÇÃO_ESTRUTURAL** (N4_SOMA_1_A):  [funções: equilibrar, avaliar, regenerar]
  [natureza: estado]

  - **PROPAGAÇÃO** (N4_VIBRATIO_3_A):  [funções: sequenciar, generalizar, avaliar]
  [natureza: processo]


  ## Ciclos e Interdependências

  - SANEAMENTO: processo dinâmico com potencial de ciclagem e retroalimentação

  - PARALELIZAÇÃO: processo dinâmico com potencial de ciclagem e retroalimentação

  - PROPAGAÇÃO: processo dinâmico com potencial de ciclagem e retroalimentação


  ## Restrições Orgânicas

  - Considerar ciclos de retroalimentação.

  - Respeitar limites de capacidade (homeostase).

  - Preservar integridade do sistema.


  ## Instrução

  Produza uma resposta que:

  1. Identifique os ciclos de vida envolvidos.

  2. Mapeie interdependências ecossistêmicas.

  3. Proponha soluções sustentáveis e adaptativas.

  4. Respeite os limites orgânicos do sistema.

  - Foco em resolução concreta e aplicável.'
